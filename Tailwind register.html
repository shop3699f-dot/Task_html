
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงทะเบียนนักศึกษาใหม่</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-blue-50 text-gray-800">

    
    <header id="main-header"
        class="bg-blue-800 text-white text-center py-8 px-4 shadow-lg">
        <h1 class="text-3xl md:text-4xl font-bold">
            ระบบลงทะเบียนนักศึกษาใหม่
        </h1>
        <p class="mt-3 text-blue-100 text-lg">
            วิทยาลัยเทคนิคสุราษฎร์ธานี
        </p>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-10">

       
        <div class="form-container bg-white rounded-2xl shadow-xl p-6 md:p-10">

            <h2 class="text-2xl font-bold text-blue-800 text-center">
                แบบฟอร์มลงทะเบียน
            </h2>

            <p class="text-gray-500 text-center mt-2 mb-8">
                กรุณากรอกข้อมูลให้ครบถ้วน
            </p>

            <form>

                
                <fieldset class="border border-blue-200 rounded-xl p-5 mb-6">
                    <legend class="text-blue-800 font-bold px-2">
                        ข้อมูลการเข้าสู่ระบบ
                    </legend>

                    <div class="mb-5">
                        <label for="username"
                            class="block font-medium mb-2">
                            ชื่อผู้ใช้ (Username)
                            <span class="text-red-500">*</span>
                        </label>

                        <input type="text" id="username"
                            name="username" required
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div class="mb-3">
                        <label for="password"
                            class="block font-medium mb-2">
                            รหัสผ่าน (Password)
                            <span class="text-red-500">*</span>
                        </label>

                        <input type="password" id="password"
                            name="password" required
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </fieldset>

               
                <fieldset class="border border-blue-200 rounded-xl p-5 mb-6">
                    <legend class="text-blue-800 font-bold px-2">
                        ข้อมูลส่วนตัว
                    </legend>

                    <div class="mb-5">
                        <label for="fullname"
                            class="block font-medium mb-2">
                            ชื่อ-นามสกุล:
                        </label>

                        <input type="text" id="fullname"
                            name="fullname"
                            placeholder="เช่น ทิพย์สุคนธ์ ทองหนู"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="mb-5">
                        <label for="email"
                            class="block font-medium mb-2">
                            อีเมล:
                        </label>

                        <input type="email" id="email"
                            name="email"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="mb-5">
                        <label for="birthday"
                            class="block font-medium mb-2">
                            วัน/เดือน/ปีเกิด:
                        </label>

                        <input type="date" id="birthday"
                            name="birthday"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="mb-3">
                        <label class="block font-medium mb-3">
                            เพศ:
                        </label>

                        <div class="flex flex-wrap gap-5">
                            <label class="flex items-center gap-2">
                                <input type="radio" id="male"
                                    name="gender" value="ชาย"
                                    class="accent-blue-700">
                                ชาย
                            </label>

                            <label class="flex items-center gap-2">
                                <input type="radio" id="female"
                                    name="gender" value="หญิง"
                                    class="accent-blue-700">
                                หญิง
                            </label>

                            <label class="flex items-center gap-2">
                                <input type="radio" id="other"
                                    name="gender" value="อื่นๆ"
                                    class="accent-blue-700">
                                อื่นๆ
                            </label>
                        </div>
                    </div>
                </fieldset>

               
                <fieldset class="border border-blue-200 rounded-xl p-5 mb-6">
                    <legend class="text-blue-800 font-bold px-2">
                        ข้อมูลการศึกษาและอื่นๆ
                    </legend>

                    <div class="mb-5">
                        <label for="education"
                            class="block font-medium mb-2">
                            ระดับชั้น:
                        </label>

                        <select id="education" name="education"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="ปวช.1">ปวช.1</option>
                            <option value="ปวช.2">ปวช.2</option>
                            <option value="ปวช.3">ปวช.3</option>
                            <option value="ปวส.1">ปวส.1</option>
                            <option value="ปวส.2">ปวส.2</option>
                            <option value="ปริญญาตรี">ป.ตรี</option>
                        </select>
                    </div>

                    <div class="mb-5">
                        <label class="block font-medium mb-3">
                            ความสนใจเพิ่มเติม:
                        </label>

                        <div class="flex flex-wrap gap-5">
                            <label class="flex items-center gap-2">
                                <input type="checkbox" id="web"
                                    name="interest" value="Web Design"
                                    class="accent-blue-700">
                                Web Design
                            </label>

                            <label class="flex items-center gap-2">
                                <input type="checkbox" id="database"
                                    name="interest" value="Database"
                                    class="accent-blue-700">
                                Database
                            </label>

                            <label class="flex items-center gap-2">
                                <input type="checkbox" id="coding"
                                    name="interest" value="Coding"
                                    class="accent-blue-700">
                                Coding
                            </label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="address"
                            class="block font-medium mb-2">
                            ที่อยู่ปัจจุบัน:
                        </label>

                        <textarea id="address" name="address"
                            rows="4"
                            placeholder="กรอกที่อยู่ปัจจุบัน"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                </fieldset>

                <div class="flex flex-col sm:flex-row gap-4 mt-8">

                    <button type="submit"
                        class="flex-1 bg-blue-700 hover:bg-blue-900 text-white font-bold py-3 rounded-lg shadow-md transition duration-300">
                        ลงทะเบียน
                    </button>

                    <button type="reset"
                        class="flex-1 bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 rounded-lg shadow-md transition duration-300">
                        ล้างข้อมูล
                    </button>

                </div>

            </form>
        </div>
    </main>

    <footer id="main-footer"
        class="bg-blue-900 text-white text-center py-5 px-4 mt-8">
        <p class="text-sm md:text-base">
            สงวนลิขสิทธิ์ 2026 แผนกวิชาเทคโนโลยีสารสนเทศ
            วิทยาลัยเทคนิคสุราษฎร์ธานี
        </p>
    </footer>

</body>
</html>
